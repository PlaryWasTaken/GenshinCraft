states:
  anemo: 185
  cryo: 185
  hydro: 185
  pyro: 185
  geo: 185
  electro: 185
  dendro: 185
  lunar: 100
  stellar: 100
  lunar-multiplier: 1.0
  stellar-multiplier: 1.0


elements:
  apply-cooldown-ticks: 25

action-bars:
  # Active elemental state shown to players. Mobs use holograms.state below.
  element-state:
    enabled: true
    format: "{symbol} {element} <reset><gray>({time}s)"
    formats:
      pyro: "<reset><red>{symbol} Pyro <reset><gray>({time}s)"
      hydro: "<reset><blue>{symbol} Hydro <reset><gray>({time}s)"
      cryo: "<reset><aqua>{symbol} Cryo <reset><gray>({time}s)"
      electro: "<reset><dark_purple>{symbol} Electro <reset><gray>({time}s)"
      anemo: "<reset><white>{symbol} Anemo <reset><gray>({time}s)"
      geo: "<reset><gold>{symbol} Geo <reset><gray>({time}s)"
      dendro: "<reset><dark_green>{symbol} Dendro <reset><gray>({time}s)"


holograms:
  damage:
    enabled: true
    decimals: 1
    formats:
      physical: "&f-{amount}"
      pyro: "&c-{amount}"
      hydro: "&9-{amount}"
      cryo: "&b-{amount}"
      electro: "&d-{amount}"
      dendro: "&a-{amount}"
      geo: "&6-{amount}"
      anemo: "&f-{amount}"

  optimize:
    enabled: true
    render-chunks: 6
    refresh-ticks: 5

  y-offset-extra-named: 0.3
  state:
    enabled: true
    # Active elemental state shown above afflicted non-player living entities.
    format: "<reset><green>%element% <reset><gray>(%time%s)"
    update-period-ticks: 1
    smooth-factor: 0.75
    y-offset-base: 0.8
    snap-dist2: 0.64
    max-step: 0.35
    teleport-dist2: 4.0


    lead-ticks: 2.0


    catchup-mult: 2.5




    formats:
      anemo: "<reset><white>Anemo <reset><gray>(%time%s)"
      cryo: "<reset><aqua>Cryo <reset><gray>(%time%s)"
      hydro: "<reset><blue>Hydro <reset><gray>(%time%s)"
      pyro: "<reset><red>Pyro <reset><gray>(%time%s)"
      geo: "<reset><gold>Geo <reset><gray>(%time%s)"
      electro: "<reset><dark_purple>Electro <reset><gray>(%time%s)"
      dendro: "<reset><dark_green>Dendro <reset><gray>(%time%s)"








  reaction:
    enabled: true
    format: "<reset><light_purple>Reaction: %reaction%"
    duration-ticks: 40
    update-period-ticks: 1
