items:
  stellar_cryo:
    name: '<gradient:#80ffff:#1e05fa>Stellar linchpin</gradient>'
    # Damage type is independent of elemental application. Omit for physical.
    damage-type: cryo
    elements:
      anemo:
        enabled: false
        amount: 0
      cryo:
        enabled: true
        amount: 1
      dendro:
        enabled: false
        amount: 0
      electro:
        enabled: false
        amount: 0
      geo:
        enabled: false
        amount: 0
      hydro:
        enabled: false
        amount: 0
      pyro:
        enabled: false
        amount: 0
      elemental:
        enabled: false
        amount: 0
      #a weapon can only be lunar or stellar, not both
      lunar:
        enabled: false #reactions performed with this weapon are lunar
        bonus: 0 #increases lunar reaction damage by 1%
      stellar:
        enabled: true #when active, reactions performed with this weapon are stellar
        bonus: 20 #increases stellar reaction damage by x%
